services:
  db:
    image: mariadb:12.3
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
      MARIADB_ROOT_PASSWORD: ${DB_PASS}
    volumes:
      - db_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d/
    ports:
      - "3306:3306"

  app:
    build: .
    depends_on:
      - db
    volumes:
      - .:/var/www/html
    ports:
      - "9999:80"
 
volumes:
  db_data:
