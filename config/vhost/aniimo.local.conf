<VirtualHost *:80>
    ServerName panini.local
    DocumentRoot /var/www/html/collection-panini/public
    <Directory /var/www/html/collection-panini/public>
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/panini-error.log
    CustomLog ${APACHE_LOG_DIR}/panini-access.log combined
</VirtualHost>